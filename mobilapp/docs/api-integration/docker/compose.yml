name: fitnessapp-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitnessapp
      POSTGRES_USER: fitnessapp
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnessapp -d fitnessapp"]
      interval: 2s
      retries: 30

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src
    volumes:
      - ../../../../API:/api-src:ro
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=fitnessapp;Username=fitnessapp;Password=postgres"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    # Copy the source so bin/obj are never written into the API folder.
    command: >
      bash -c "cp -r /api-src/. /src && rm -rf /src/bin /src/obj &&
      dotnet tool install --global dotnet-ef --version '10.*' &&
      export PATH=$$PATH:/root/.dotnet/tools &&
      dotnet restore API.csproj && dotnet ef database update --project API.csproj"

  api:
    build:
      context: ../../../../API
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=fitnessapp;Username=fitnessapp;Password=postgres"
      DataProtection__KeysPath: /tmp/dp-keys
    ports:
      - "5210:8080"
    volumes:
      - ./outbox:/app/.dev-outbox
