<div class="collections-page__scroll">
  <header class="collections-page__header">
    <div class="collections-page__intro">
      <h1 class="collections-page__title">{{ 'collections.page.title' | translate }}</h1>
      <p class="collections-page__subtitle">
        {{ 'collections.page.subtitle' | translate }}
      </p>
    </div>
    <button
      app-ui-icon-button
      size="sm"
      tone="accent"
      type="button"
      [attr.aria-label]="'collections.page.create' | translate"
      (click)="openSheet()"
    >
      <app-ui-icon name="plus" size="xl" [strokeWidth]="1.9" />
    </button>
  </header>

  @switch (status()) {
    @case ('loading') {
      <div class="collections-page__status">
        <app-ui-spinner size="lg" />
      </div>
    }
    @case ('error') {
      <div class="collections-page__status">
        <app-ui-empty-state
          class="collections-page__status-message"
          [message]="'collections.page.loadError' | translate"
        />
        <button app-ui-button type="button" variant="outline" size="md" (click)="retry()">
          {{ 'collections.page.retry' | translate }}
        </button>
      </div>
    }
    @default {
      @if (entries().length === 0) {
        <app-ui-empty-state
          class="collections-page__empty"
          [message]="'collections.page.empty' | translate"
        />
      } @else {
        <ul class="collections-page__list">
          @for (entry of entries(); track entry.id) {
            <li class="collections-page__item">
              <button type="button" class="collections-page__card" (click)="open(entry)">
                <span class="collections-page__icon">
                  <app-ui-icon name="utensils" size="3xl" [strokeWidth]="1.9" />
                </span>
                <span class="collections-page__body">
                  <span class="collections-page__meta">{{ entry.meta }}</span>
                  <span class="collections-page__card-title">{{ entry.title }}</span>
                  <span class="collections-page__sub">{{ entry.subtitle }}</span>
                  <span class="collections-page__macros">
                    {{ entry.macrosText }}
                  </span>
                </span>
              </button>
            </li>
          }
        </ul>
      }
    }
  }
</div>

<div class="collections-page__spacer" aria-hidden="true"></div>

<app-new-collection-sheet
  [open]="sheetOpen()"
  [busy]="saving()"
  [error]="saveError()"
  (closed)="sheetOpen.set(false)"
  (created)="onCreated($event)"
/>
