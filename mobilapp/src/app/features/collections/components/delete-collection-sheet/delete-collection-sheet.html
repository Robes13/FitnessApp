<app-ui-sheet
  [open]="open()"
  [title]="'collections.deleteSheet.title' | translate"
  [titleAccent]="'collections.deleteSheet.titleAccent' | translate"
  titleAccentTone="negative"
  titleSize="sm"
  hideClose
  scrollable
  layer="overlay"
>
  <p class="delete-collection-sheet__body">
    {{ 'collections.deleteSheet.body' | translate: { name: name() } }}
  </p>

  <div sheetFooter class="delete-collection-sheet__actions">
    <button app-ui-button type="button" variant="danger" block (click)="confirmed.emit()">
      {{ 'collections.deleteSheet.confirm' | translate }}
    </button>
    <button app-ui-button type="button" variant="outline" block (click)="closed.emit()">
      {{ 'collections.deleteSheet.cancel' | translate }}
    </button>
  </div>
</app-ui-sheet>
