<app-ui-sheet
  [open]="open()"
  [title]="'profile.logoutSheet.titleStart' | translate"
  [titleAccent]="'profile.logoutSheet.titleAccent' | translate"
  titleAccentTone="negative"
  titleSize="sm"
  hideClose
  [closeOnEscape]="!busy()"
  scrollable
  layer="overlay"
  (closed)="closed.emit()"
>
  <span sheetLeading class="profile-logout-sheet__mark" aria-hidden="true">
    <app-ui-icon name="log-out" size="xl" />
  </span>

  <p class="profile-logout-sheet__body">
    {{ 'profile.logoutSheet.body' | translate }}
  </p>

  <div sheetFooter class="profile-logout-sheet__actions">
    <button
      app-ui-button
      type="button"
      variant="danger"
      block
      [loading]="busy()"
      (click)="confirmed.emit()"
    >
      {{ 'profile.logoutSheet.confirm' | translate }}
    </button>
    <button
      app-ui-button
      type="button"
      variant="outline"
      block
      [disabled]="busy()"
      (click)="closed.emit()"
    >
      {{ 'profile.logoutSheet.cancel' | translate }}
    </button>
  </div>
</app-ui-sheet>
