<app-ui-sheet
  [open]="open()"
  [title]="'profile.photoSheet.titleStart' | translate"
  [titleAccent]="'profile.photoSheet.titleAccent' | translate"
  titleAccentJoined
  titleSize="sm"
  maxHeight="tall"
  scrollable
  [hideClose]="busy() !== null"
  (closed)="onClose()"
>
  @if (errorMessage()) {
    <app-ui-form-error tone="negative" [message]="errorMessage()" />
  }

  @if (photo(); as picked) {
    <div class="profile-photo-sheet__editor">
      <div
        class="profile-photo-sheet__crop"
        tabindex="0"
        [attr.aria-label]="'profile.photoSheet.cropAriaLabel' | translate"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointercancel)="onPointerUp()"
        (pointerleave)="onPointerUp()"
        (keydown)="onKeydown($event)"
      >
        <app-profile-avatar size="xl" [photo]="picked" [initial]="initial()" />
      </div>
    </div>
    <p class="profile-photo-sheet__hint">{{ 'profile.photoSheet.dragHint' | translate }}</p>
    <div class="profile-photo-sheet__zoom">
      <span class="profile-photo-sheet__zoom-label">{{
        'profile.photoSheet.zoom' | translate
      }}</span>
      <input
        class="profile-photo-sheet__zoom-input"
        type="range"
        [attr.aria-label]="'profile.photoSheet.zoom' | translate"
        [min]="zoomMin"
        [max]="zoomMax"
        [value]="zoomPercent()"
        (input)="onZoomChange($event)"
      />
      <span class="profile-photo-sheet__zoom-value">{{ zoomLabel() }}</span>
    </div>
    <div class="profile-photo-sheet__actions">
      <button
        app-ui-button
        type="button"
        variant="surface"
        size="sm"
        shape="rounded"
        block
        class="profile-photo-sheet__action"
        (click)="recenter()"
      >
        {{ 'profile.photoSheet.recenter' | translate }}
      </button>
      <button
        app-ui-button
        type="button"
        variant="surface"
        size="sm"
        shape="rounded"
        block
        class="profile-photo-sheet__action profile-photo-sheet__action--remove"
        [loading]="removing()"
        [disabled]="uploading()"
        (click)="removePhoto()"
      >
        {{ 'profile.photoSheet.remove' | translate }}
      </button>
    </div>
    <label class="profile-photo-sheet__replace">
      <span>{{ 'profile.photoSheet.chooseAnother' | translate }}</span>
      <input
        class="profile-photo-sheet__file"
        type="file"
        accept="image/*"
        [attr.aria-label]="'profile.photoSheet.chooseAnother' | translate"
        (change)="onFileChange($event)"
      />
    </label>
    <label class="profile-photo-sheet__replace">
      <span>{{ 'profile.photoSheet.takePhoto' | translate }}</span>
      <input
        class="profile-photo-sheet__file"
        type="file"
        accept="image/*"
        capture="user"
        [attr.aria-label]="'profile.photoSheet.takePhoto' | translate"
        (change)="onFileChange($event)"
      />
    </label>
    <button
      app-ui-button
      type="button"
      block
      class="profile-photo-sheet__use"
      [loading]="uploading()"
      [disabled]="removing()"
      (click)="usePhoto()"
    >
      {{ 'profile.photoSheet.use' | translate }}
    </button>
  } @else {
    <div class="profile-photo-sheet__editor">
      <app-profile-avatar size="lg" [photo]="savedPhoto()" [initial]="initial()" />
    </div>
    <label class="profile-photo-sheet__pick">
      <app-ui-icon name="image" size="md" />
      <span>{{ 'profile.photoSheet.choose' | translate }}</span>
      <input
        class="profile-photo-sheet__file"
        type="file"
        accept="image/*"
        [attr.aria-label]="'profile.photoSheet.choose' | translate"
        (change)="onFileChange($event)"
      />
    </label>
    <label class="profile-photo-sheet__replace">
      <span>{{ 'profile.photoSheet.takePhoto' | translate }}</span>
      <input
        class="profile-photo-sheet__file"
        type="file"
        accept="image/*"
        capture="user"
        [attr.aria-label]="'profile.photoSheet.takePhoto' | translate"
        (change)="onFileChange($event)"
      />
    </label>
    <p class="profile-photo-sheet__hint">{{ 'profile.photoSheet.cropLaterHint' | translate }}</p>
    @if (savedPhoto()) {
      <button
        app-ui-button
        type="button"
        variant="surface"
        size="sm"
        shape="rounded"
        block
        class="profile-photo-sheet__action profile-photo-sheet__action--remove profile-photo-sheet__action--saved"
        [loading]="removing()"
        (click)="removePhoto()"
      >
        {{ 'profile.photoSheet.remove' | translate }}
      </button>
    }
  }
</app-ui-sheet>
