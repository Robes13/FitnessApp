<div class="food-meal-group__head">
  <span class="food-meal-group__label">{{ group().label }}</span>
  <span class="food-meal-group__total" [class.food-meal-group__total--empty]="!group().hasKcal">
    {{ group().kcalText }}
  </span>
</div>

@for (entry of group().entries; track entry.logId) {
  <div class="food-meal-group__item">
    <button
      type="button"
      class="food-meal-group__name"
      [attr.aria-label]="editLabel(entry)"
      (click)="edit.emit(entry)"
    >
      <span class="food-meal-group__dot"></span>
      <span class="food-meal-group__name-text">{{ entry.name }}</span>
      <span class="food-meal-group__quantity">{{ quantity(entry) }}</span>
    </button>
    <span class="food-meal-group__end">
      <span class="food-meal-group__kcal"
        >{{ kcal(entry) }} {{ 'common.unit.kcal' | translate }}</span
      >
      <button
        type="button"
        class="food-meal-group__remove"
        [attr.aria-label]="removeLabel(entry)"
        (click)="removed.emit(entry)"
      >
        <app-ui-icon name="close" size="xs" [strokeWidth]="2.4" />
      </button>
    </span>
  </div>
}

<button type="button" class="food-meal-group__add" (click)="add.emit()">
  {{ group().addLabel }}
</button>
