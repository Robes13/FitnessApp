<app-auth-backdrop [gradient]="keyboardOpen()" />

<div class="login-page__content">
  <div class="login-page__brand">
    <img class="login-page__logo" [src]="logoSrc" alt="" />
    <span class="login-page__wordmark">Nutrify</span>
  </div>

  <div class="login-page__spacer"></div>

  <h1 class="login-page__heading">
    {{ 'auth.loginPage.headingStart' | translate }}<br /><span class="login-page__heading-accent">{{
      'auth.loginPage.headingAccent' | translate
    }}</span>
  </h1>

  <form class="login-page__form" [formGroup]="form" (ngSubmit)="submit()">
    <app-ui-text-input
      formControlName="identifier"
      [placeholder]="'auth.loginPage.identifier' | translate"
      [ariaLabel]="'auth.loginPage.identifier' | translate"
      autocomplete="username"
      translucent
    />
    <app-ui-text-input
      formControlName="password"
      type="password"
      [placeholder]="'auth.loginPage.password' | translate"
      [ariaLabel]="'auth.loginPage.password' | translate"
      autocomplete="current-password"
      translucent
    />
    @if (errorKey(); as key) {
      <app-ui-form-error [message]="key | translate" tone="negative" />
    }
    <button class="login-page__submit" app-ui-button type="submit" block [loading]="loading()">
      {{ 'auth.loginPage.submit' | translate }}
    </button>
  </form>

  <div class="login-page__footer">
    <span>
      {{ 'auth.loginPage.newHere' | translate }}
      <a class="login-page__link" [routerLink]="signupPath">{{
        'auth.loginPage.createAccount' | translate
      }}</a>
    </span>
    <a class="login-page__link login-page__link--muted" [routerLink]="forgotPasswordPath">
      {{ 'auth.loginPage.forgotPassword' | translate }}
    </a>
  </div>
</div>
