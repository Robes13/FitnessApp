<h1 class="training-duration-step__title">
  {{ 'signup.trainingDurationStep.titleStart' | translate }}
  <span class="training-duration-step__title-accent">{{
    'signup.trainingDurationStep.titleAccent' | translate
  }}</span>
</h1>
<p class="training-duration-step__subtitle">{{ subtitle() }}</p>

<div class="training-duration-step__body">
  <div class="training-duration-step__readout">
    <div class="training-duration-step__count-row">
      <div class="training-duration-step__count">{{ minutesText() }}</div>
      <div class="training-duration-step__unit">
        {{ 'signup.trainingDurationStep.unit' | translate }}
      </div>
    </div>

    <div class="training-duration-step__pill">
      <span class="training-duration-step__pill-dot"></span>
      <span class="training-duration-step__pill-label">{{ label() }}</span>
    </div>

    <p class="training-duration-step__hint">
      {{ 'signup.trainingDurationStep.hint' | translate }}
    </p>
  </div>

  <svg
    class="training-duration-step__scene"
    viewBox="0 0 200 300"
    preserveAspectRatio="xMidYMax meet"
    [attr.aria-label]="'signup.trainingDurationStep.figureLabel' | translate"
  >
    <g class="training-duration-step__dial">
      <circle
        class="training-duration-step__dial-track"
        cx="100"
        cy="108"
        r="58"
        stroke-width="10"
      />
      <circle
        class="training-duration-step__dial-arc"
        cx="100"
        cy="108"
        r="58"
        stroke-width="10"
        stroke-linecap="round"
        [attr.stroke-dasharray]="dialCircumference"
        [attr.stroke-dashoffset]="arcOffset()"
      />
    </g>

    <rect class="training-duration-step__crown" x="92" y="38" width="16" height="9" rx="4" />

    <g class="training-duration-step__hand" [appFigureTempo]="sweepDuration()">
      <rect class="training-duration-step__needle" x="98.5" y="68" width="3" height="42" rx="1.5" />
    </g>
    <circle class="training-duration-step__pin" cx="100" cy="108" r="5" />

    <g class="training-duration-step__figure">
      <ellipse
        class="training-duration-step__shadow"
        cx="100"
        cy="292"
        [attr.rx]="figure().shadowRx"
        ry="6"
      />
      <g class="training-duration-step__bob" [appFigureTempo]="bobDuration">
        <g
          app-figure-body
          [geometry]="figure()"
          [bandTone]="bandTone()"
          [expression]="expression"
          [showShadow]="false"
          [animated]="false"
          shaded
        ></g>
      </g>
    </g>
  </svg>
</div>

<app-ui-ruler
  class="training-duration-step__ruler"
  [min]="rulerMin"
  [max]="rulerMax"
  [(value)]="state.trainingMinutes"
  [step]="rulerStep"
  [(dragging)]="dragging"
  [ariaLabel]="'signup.trainingDurationStep.rulerLabel' | translate"
/>
