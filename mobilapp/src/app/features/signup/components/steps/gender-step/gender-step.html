<h1 class="gender-step__title">
  {{ 'signup.genderStep.titleStart' | translate }}
  <span class="gender-step__title-accent">{{ 'signup.genderStep.titleAccent' | translate }}</span>
</h1>
<p class="gender-step__subtitle">{{ 'signup.genderStep.subtitle' | translate }}</p>

<div class="gender-step__options">
  @for (gender of genders; track gender.id) {
    <button
      app-ui-option-card
      class="gender-step__option"
      [label]="gender.labelKey | translate"
      [description]="gender.descriptionKey | translate"
      [selected]="state.gender() === gender.id"
      selectionStyle="accent-radio"
      (click)="select(gender.id)"
    ></button>
  }
</div>

<div class="gender-step__spacer"></div>
