<h1 class="goal-step__title">Hvad er dit <span class="goal-step__title-accent">mål?</span></h1>
<p class="goal-step__intro">Hvad vil du med din vægt?</p>

<div class="goal-step__options">
  @for (option of options; track option.id) {
    <button
      app-ui-option-card
      [label]="option.label"
      [description]="option.description"
      [selected]="state.goal() === option.id"
      selectionStyle="selected"
      (click)="select(option.id)"
    >
      <span optionTrailing class="goal-step__glyph" [class]="option.glyphClass" aria-hidden="true">
        {{ option.glyph }}
      </span>
    </button>
  }
</div>
