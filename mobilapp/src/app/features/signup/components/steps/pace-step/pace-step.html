<h1 class="pace-step__title">Hvor <span class="pace-step__title-accent">hurtigt?</span></h1>
<p class="pace-step__intro">{{ intro() }}</p>

<div class="pace-step__options">
  @for (option of options; track option.id) {
    <button
      app-ui-option-card
      [label]="option.label"
      [description]="option.description"
      [selected]="state.pace() === option.id"
      selectionStyle="selected"
      (click)="select(option.id)"
    >
      <span optionTrailing class="pace-step__rate">{{ option.rateLabel }}</span>
    </button>
  }
</div>

<p class="pace-step__summary">{{ summary() }}</p>
