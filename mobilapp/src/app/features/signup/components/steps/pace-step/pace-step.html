<h1 class="pace-step__title">
  {{ 'signup.paceStep.titleStart' | translate }}
  <span class="pace-step__title-accent">{{ 'signup.paceStep.titleAccent' | translate }}</span>
</h1>
<p class="pace-step__intro">{{ intro() }}</p>

<div class="pace-step__options">
  @for (option of options; track option.id) {
    <button
      app-ui-option-card
      [label]="option.labelKey | translate"
      [description]="option.descriptionKey | translate"
      [selected]="state.pace() === option.id"
      selectionStyle="selected"
      (click)="select(option.id)"
    >
      <span optionTrailing class="pace-step__rate">{{ option.rateLabelKey | translate }}</span>
    </button>
  }
</div>

<p class="pace-step__summary">{{ summary() }}</p>
