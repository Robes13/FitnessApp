@if (!compact()) {
  <app-ui-progress-ring
    [value]="value()"
    [diameter]="ringDiameter"
    [strokeWidth]="ringStrokeWidth"
    trackTone="neutral"
  >
    <span class="signup-progress__number">{{ stepNumber() }}</span>
  </app-ui-progress-ring>
}

<div class="signup-progress__meta">
  <div class="signup-progress__heading">
    <span class="signup-progress__chapter">{{ chapterLabel() }}</span>
    <span class="signup-progress__caption">{{ caption() }}</span>
  </div>

  <div class="signup-progress__segments">
    @for (chapter of chapters(); track chapter.label) {
      <div class="signup-progress__segment" [style.flex-grow]="chapter.flex">
        <div class="signup-progress__bar">
          <div class="signup-progress__fill" [style.width.%]="chapter.pct"></div>
        </div>
        @if (!compact()) {
          <div
            class="signup-progress__label"
            [class.signup-progress__label--active]="chapter.active"
            [class.signup-progress__label--done]="chapter.done"
          >
            {{ chapter.label }}
          </div>
        }
      </div>
    }
  </div>
</div>
