<div class="ui-page-header__lead">
  <button
    app-ui-icon-button
    size="sm"
    type="button"
    [attr.aria-label]="backLabelText()"
    (click)="back.emit()"
  >
    <app-ui-icon name="chevron-left" size="lg" />
  </button>
</div>
<h1 class="ui-page-header__title">{{ title() }}</h1>
<div class="ui-page-header__action"><ng-content select="[headerAction]" /></div>
