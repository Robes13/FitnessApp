# Render Blueprint: API'et på Renders gratis plan (ingen kreditkort).
# Databasen ligger på Neon (gratis), så Renders egen Postgres bruges ikke.
services:
  - type: web
    name: nutrify-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./API/Dockerfile
    dockerContext: ./API
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: Database__MigrateOnStartup
        value: "true"
      - key: App__PublicBaseUrl
        value: https://nutrify-api.onrender.com
      - key: Jwt__SigningKey
        generateValue: true
      # Udfyldes i Render-dashboardet ved oprettelse
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AzureBlobStorage__SasToken
        sync: false
      - key: Smtp__Password
        sync: false
